[package]
name = "bc_indicators_gw"
version = "0.5.0"
edition = "2024"

[dependencies]
bc_indicators = {path = "../bc_indicators"}
bc_gw_utils = {path = "../bc_gw_utils"}
bc_utils_lg = {path = "../bc_utils_lg", features = ["test_state"]}

[dev-dependencies]
bc_utils = {path = "../bc_utils"}
bc_test_kit = {path = "../bc_test_kit"}
bc_packs = {path = "../bc_packs"}

criterion = {version = "0.3.5", features = ["html_reports"]}
pretty_assertions = "1"

[[bench]]
name = "gw"
harness = false
path = "benches/gw.rs"

[features]
test_state = []
